
services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DB_HOST: host.docker.internal
      DB_PORT: "5432"
      DB_NAME: db
      DB_USER: user
      DB_PASSWORD: pass

  frontend:
    build: ./Frontend
    ports:
      - "5173:80"
    depends_on:ss
      - backend
